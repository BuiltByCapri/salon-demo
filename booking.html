<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Book · Casa Luz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#1A1716; --grey:#6E6764; --line:#E7E2DE; --band:#F6F5F4; --tile:#FAEDE9; --tile-on:#F3D6CD; --peach:#E9AE9C; --peach-lt:#EED9CF;
  --serif:"Libre Caslon Display",Georgia,serif; --sans:"Jost",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.demo{background:var(--ink);color:#e9e4e0;text-align:center;font-size:12.5px;padding:.5rem 16px}
.demo button{color:#fff;text-decoration:underline;font-size:12.5px;margin-left:.35rem}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:68px;padding:0 24px;border-bottom:1px solid #f0edeb}
.back-site{font-size:13px;text-decoration:none;color:var(--grey)}
.back-site:hover{color:var(--ink)}
.word{font:500 24px var(--sans);letter-spacing:.32em;text-decoration:none;white-space:nowrap}
.lang{justify-self:end;display:flex;gap:.7rem}
.lang button{font-size:13px;color:var(--grey)}
.lang button[aria-pressed="true"]{color:var(--ink);font-weight:500}
@media(max-width:600px){header{padding:0 14px}.word{font-size:16px;letter-spacing:.22em}.back-site span{display:none}}

/* Progress */
.prog{background:var(--band);padding:1.4rem 24px 1.1rem}
.steps{position:relative;display:flex;justify-content:space-between;align-items:flex-start;max-width:1140px;margin:0 auto;padding-bottom:1rem}
.steps::before{content:"";position:absolute;left:14px;right:14px;top:14px;height:3px;background:var(--peach-lt)}
.steps .fill{position:absolute;left:14px;top:14px;height:3px;background:var(--peach)}
.st{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.25rem;font-size:11.5px;min-width:56px}
.st .dot{width:30px;height:30px;border-radius:50%;background:var(--peach-lt);display:grid;place-items:center;font-size:14px;transition:background .3s}
.st.now .dot{background:#fff;box-shadow:0 0 0 2px var(--peach)}
.st.past .dot{background:var(--peach)}
.st .edit{position:absolute;top:100%;margin-top:.1rem;font-size:11px;text-decoration:underline;color:var(--grey)}
.where{text-align:center;font-size:14px;margin-top:1rem}

/* Step body */
main{max-width:980px;margin:0 auto;padding:2rem 20px}
.q{text-align:center;font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:400;margin-bottom:1.6rem}
.view.enter{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.techs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tile{background:var(--tile);text-align:center;padding:1rem 1rem 1.2rem;transition:background .2s,box-shadow .2s}
.tile:hover{background:var(--tile-on)}
.tile[aria-pressed="true"]{background:var(--tile-on);box-shadow:inset 0 0 0 2px var(--peach)}
.tile img{width:100%;aspect-ratio:3/4;object-fit:cover;margin-bottom:.9rem}
.tile .any{width:100%;aspect-ratio:3/4;display:grid;place-items:center;margin-bottom:.9rem;font:italic 400 34px/1.1 var(--serif);color:#8a6f66;background:#f6e3dd}
.tile b{display:block;font:400 22px var(--serif)}
.tile span{font-size:13px;color:var(--grey)}
.tile .soon{display:block;margin-top:.35rem;font-size:12.5px;color:#9a5d4c}

.svcs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.svc{background:var(--tile);text-align:left;padding:1.3rem 1.4rem;display:flex;justify-content:space-between;gap:1rem;align-items:center;transition:background .2s,box-shadow .2s}
.svc:hover{background:var(--tile-on)}
.svc[aria-pressed="true"]{background:var(--tile-on);box-shadow:inset 0 0 0 2px var(--peach)}
.svc b{display:block;font-weight:500;font-size:16px}
.svc span{font-size:13px;color:var(--grey)}
.svc .price{font:400 22px var(--serif);white-space:nowrap}


.guests{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);max-width:640px;margin:0 auto}
.gt{background:var(--tile);aspect-ratio:1.25;display:grid;place-items:center;font-size:20px;transition:background .2s,box-shadow .2s}
.gt:hover{background:var(--tile-on)}
.gt[aria-pressed="true"]{background:var(--tile-on);box-shadow:inset 0 0 0 2px var(--peach)}
.gt small{display:block;font-size:12px;color:var(--grey);margin-top:.2rem}
.more-g{display:flex;justify-content:space-between;align-items:center;max-width:500px;margin:1.4rem auto 0;border:1px solid var(--line);padding:.9rem 1.2rem;text-decoration:none;font-size:15px}
.gblock + .gblock{margin-top:2rem}
.gname{font:400 22px var(--serif);margin-bottom:.8rem;display:flex;gap:.6rem;align-items:baseline}
.gname span{font:400 13px var(--sans);color:var(--grey)}
.pick{display:flex;flex-wrap:wrap;gap:.5rem}
.pchip{display:flex;align-items:center;gap:.6rem;background:var(--tile);padding:.4rem 1rem .4rem .4rem;font-size:15px;transition:background .2s,box-shadow .2s}
.pchip img,.pchip .ai{width:40px;height:40px;border-radius:50%;object-fit:cover}
.pchip .ai{display:grid;place-items:center;background:#f6e3dd;font:italic 400 16px var(--serif);color:#8a6f66}
.pchip:hover{background:var(--tile-on)}
.pchip[aria-pressed="true"]{background:var(--tile-on);box-shadow:inset 0 0 0 2px var(--peach)}
.pchip:disabled{opacity:.4;cursor:default}
.warn{color:#a2503c;font-size:14px;margin-top:1rem;text-align:center}
.who{font-size:13px;color:var(--grey);margin-top:.3rem}
.when{display:grid;gap:1.6rem}
@media(min-width:820px){.when{grid-template-columns:1fr 1fr;align-items:start}}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.cal-head b{font:400 22px var(--serif);text-transform:capitalize}
.cal-head button{width:36px;height:36px;background:var(--band)}
.cal-head button:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.dow{font-size:11px;letter-spacing:.1em;color:var(--grey);padding:.3rem 0;text-transform:uppercase}
.day{aspect-ratio:1;font-size:15px;display:grid;place-items:center;position:relative}
.day:disabled{color:#cdc8c5;cursor:default}
.day.open{background:var(--tile)}
.day.open:hover{background:var(--tile-on)}
.day[aria-pressed="true"]{background:var(--peach);color:#fff}
.times-h{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);margin-bottom:.8rem}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.time{background:var(--tile);padding:.75rem 0;font-size:14.5px}
.time:hover{background:var(--tile-on)}
.time[aria-pressed="true"]{background:var(--peach);color:#fff}
.time:disabled{background:none;color:#cdc8c5;text-decoration:line-through;cursor:default}
.empty{color:var(--grey);font-size:14px}

.confirm{display:grid;gap:1.6rem;max-width:760px;margin:0 auto}
@media(min-width:820px){.confirm{grid-template-columns:1fr 1fr}}
.card{background:var(--band);padding:1.4rem}
.card h3{font:400 24px var(--serif);margin-bottom:.8rem}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}
.row span:first-child{color:var(--grey)}
.with{display:flex;gap:.9rem;align-items:center;margin-bottom:1rem}
.with img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.with b{font:400 22px var(--serif)}
.fields{display:grid;gap:.7rem}
.fields label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);display:grid;gap:.3rem}
.fields input{font:inherit;border:1px solid var(--line);padding:.85rem 1rem;color:var(--ink);background:#fff}
.dep{margin-top:1rem;font-size:13.5px;color:var(--grey)}
.dep b{color:var(--ink)}

.done{text-align:center;padding:3rem 1rem}
.done .check{width:72px;height:72px;border-radius:50%;background:var(--peach);color:#fff;display:grid;place-items:center;margin:0 auto 1.2rem;font-size:28px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.done h2{font:400 40px var(--serif);margin-bottom:.5rem}
.done p{color:var(--grey);max-width:30rem;margin:0 auto}
.done .home{display:inline-block;margin-top:1.8rem;background:var(--peach);color:#fff;padding:.9rem 1.8rem;text-decoration:none;font-size:13px;letter-spacing:.12em;text-transform:uppercase}

/* Bottom bar, like the reference */
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--band);padding:.9rem 24px;display:flex;justify-content:flex-end;align-items:center;gap:1.2rem;z-index:20}
.bottom .hint{margin-right:auto;font-size:13.5px;color:var(--grey)}
.bottom button{min-width:148px;padding:.9rem 1.2rem;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
#backBtn{background:var(--peach-lt)}
#nextBtn{background:var(--peach);color:#fff}
#nextBtn:disabled{opacity:.45;cursor:default}
@media(max-width:600px){.bottom{padding:.7rem 12px;gap:.6rem}.bottom .hint{display:none}.bottom button{flex:1;min-width:0}}

/* Guided tour */
.tour-dim{position:fixed;inset:0;z-index:40;pointer-events:none}
.tour-ring{position:absolute;box-shadow:0 0 0 9999px rgba(20,16,14,.55);transition:all .18s ease-out;outline:2px solid var(--peach);outline-offset:4px}
.tour-tip{position:fixed;z-index:41;width:min(320px,calc(100vw - 32px));background:#fff;padding:1.2rem 1.25rem;font-size:15px;line-height:1.5;transition:top .18s,left .18s;box-shadow:0 18px 44px rgba(0,0,0,.25)}
.tour-tip .n{font-size:11px;letter-spacing:.16em;color:var(--grey);margin-bottom:.4rem}
.tour-tip .act{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.tour-tip .act button{font-size:13px;color:var(--grey)}
.tour-tip .act .go{background:var(--peach);color:#fff;padding:.55rem 1.2rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="demo"><span data-t="demoBar"></span><button type="button" id="tourBtn" data-t="tourBtn"></button></div>

<header>
  <a class="back-site" href="index.html">‹ <span data-t="backSite"></span></a>
  <a class="word" href="index.html">CASA LUZ</a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="es" aria-pressed="false">Español</button>
  </div>
</header>

<div class="prog">
  <div class="steps" id="steps"><span class="fill" id="fill"></span></div>
  <p class="where">⌖ Casa Luz · Coral Way, Miami</p>
</div>

<main id="main"></main>

<div class="bottom" id="bottom">
  <span class="hint" id="hint"></span>
  <button type="button" id="backBtn" data-t="back"></button>
  <button type="button" id="nextBtn" data-t="next"></button>
</div>

<script src="salon.js?v=3"></script>
<script src="booking.js?v=3"></script>
</body>
</html>
